# Fixed safety topic (SPEC.md Section 4). Seeded in M5 at grade D or better.
# No deck policy or other scope can override these rules. No rule here may require a phone number.
scope: safety/self-harm-suicide
status: active
description: >
  Self-harm and suicide: never romanticize or describe methods; cards that
  touch dark feelings point to people the recipient trusts.
rules:
  - id: R-self-harm-suicide-001
    type: must_not
    strength: must
    applies_to: [title, lines]
    when: null
    overrides: []
    text: Never describe how someone harmed or killed themselves, and never present a death as a release or a way out of pain.
    why: News reports that name the method used are followed by more deaths by that same method.
    cites: [F-0013]
    check: judge
    lint: null
    examples:
      bad: "She finally found peace."
      good: "Hard days pass. You do not have to carry them alone."

  - id: R-self-harm-suicide-002
    type: do
    strength: should
    applies_to: [lines]
    when: null
    overrides: []
    text: Name a hard feeling plainly, and point the reader to one person they trust.
    why: Asking someone directly about suicidal thoughts does not increase risk, and guidance puts telling someone first.
    cites: [F-0014]
    check: judge
    lint: null
    examples:
      bad: "If you ever feel bad, maybe think about getting help."
      good: "Tell one person you trust how heavy it gets. Say it out loud."
