          target: Change
        note: Slower? Softer? Other foot?
      - text: and try it again.
        mark:
          target: again
        note: Give it three more tries.
      - text: Every try teaches you something,
        mark:
        note:
      - text: and that's how hard gets easy.
        mark:
          target: easy
        note: What will you get good at this year?
