  - n: 50
    category: game-day
    title: On the BENCH
    lines:
      - text: Subbed out? That's normal.
        mark:
          target: out
        note: Everybody takes turns.
      - text: You're still on the team.
        mark:
          target: team
        note: Cheer loud. Watch and learn.
      - text: Get a drink, catch your breath,
        mark:
          target: breath
        note: Rest so you're fast when you go back in.
      - text: and be ready to go back in.
        mark:
          target: ready
        note: Know the score and where you'll play.
      - text: Good teammates help from anywhere.
        mark:
        note:
