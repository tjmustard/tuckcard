      - text: or draw them on paper.
        mark:
          target: draw
        note: Then fold it up small.
      - text: Ask, "What could I do?"
        mark:
          target: do
        note: Pick one small thing to try.
      - text: Shared worries get smaller.
        mark:
        note:
