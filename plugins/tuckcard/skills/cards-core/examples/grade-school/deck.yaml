  - n: 49
    category: school
    title: A Tough TEACHER
    lines:
      - text: Some teachers feel strict.
        mark:
          target: strict
        note: Strict often means they care a lot.
      - text: Be respectful anyway.
        mark:
          target: respectful
        note: Kind words, calm voice.
      - text: Do your part,
        mark:
          target: part
        note: Listen, try, and follow the rules.
      - text: and tell us how it's going.
        mark:
          target: tell us
        note: Something feel unfair? Tell us.
      - text: We're on your team.
        mark:
        note:
