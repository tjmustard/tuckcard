  - n: 51
    category: feelings
    title: When You're MAD
    lines:
      - text: Feeling mad is OK.
        mark:
          target: mad
        note: Mad tells you something feels unfair.
      - text: Hurting is not.
        mark:
          target: Hurting
        note: No hitting, kicking, or mean words.
      - text: Stomp, squeeze, or walk away,
        mark:
          target: Stomp
        note: Stomp your feet, not your sister.
      - text: then talk it out.
        mark:
          target: talk
        note: "\"I'm mad because...\""
      - text: Mad goes away. Mean words stay.
        mark:
        note:
