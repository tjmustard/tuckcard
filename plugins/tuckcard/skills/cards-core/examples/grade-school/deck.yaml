  - n: 52
    category: friends
    title: Sisters Are a TEAM
    lines:
      - text: Sisters are a team.
        mark:
          target: Sisters
        note: Same team, every season.
      - text: You might bug each other,
        mark:
          target: bug
        note: Normal. Then shake it off.
      - text: but you help each other.
        mark:
          target: help
        note: Cheer at her games. She'll cheer at yours.
      - text: Learn from your big sister,
        mark:
          target: Learn
        note: Ask her how she got good at stuff.
      - text: and have her back too.
        mark:
        note:
