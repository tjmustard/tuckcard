    category: speak-up
    title: Say THANK YOU
    lines:
      - text: Say thank you every day.
        mark:
          target: thank you
        note: For dinner, rides, and help.
      - text: To teachers, coaches,
        mark:
          target: teachers
        note: Say it on your way out the door.
      - text: and the lunch helpers too.
        mark:
          target: lunch
        note: Look at them when you say it.
      - text: Write a thank-you card.
