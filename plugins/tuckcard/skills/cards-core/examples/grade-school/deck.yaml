        note: '"I feel mad," "I feel left out."'
      - text: then say why.
        mark:
          target: why
        note: '"...when you took my blocks."'
      - text: Then say what you need.
        mark:
          target: need
        note: '"Can you give them back, please?"'
      - text: People listen better that way.
        mark:
