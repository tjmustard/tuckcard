      - text: Each lecture costs you.
        mark:
          target: costs
        note: Tuition divided by lectures. Ouch.
      - text: Profs drop hints in class
        mark:
          target: hints
        note: '"This will be on the exam." Write it down.'
      - text: that never make the slides.
        mark:
          target: slides
        note: Slides are a summary. Class is the lesson.
      - text: Sit near the front.
