  - n: 48
    category: life-skills
    title: Don't Drive DROWSY
    lines:
      - text: A long drive is no joke.
        mark:
          target: long
        note: Leave rested, not after an all-nighter.
      - text: Tired is as risky as drunk.
        mark:
          target: drunk
        note: 24 hours awake is like a 0.10 BAC.
      - text: Stop every two hours.
        mark:
          target: Stop
        note: Gas, stretch, walk around.
      - text: Eyes heavy? Nap.
        mark:
          target: Nap
        note: 20 minutes in a safe lot. Seriously.
      - text: Text us when you're there.
        mark:
        note:
    basis:
      - R-college-008
      - R-core-006
    visibility: public
    approval:
      approved_hash: 25221ed0fb6b4d2955f2da174fce6a87e493cdfd5f9e6d52251af996654b4f58
      approved_by: round
      approved_round: 3
      linted_hash: 25221ed0fb6b4d2955f2da174fce6a87e493cdfd5f9e6d52251af996654b4f58
  - n: 49
    category: choices
    title: Know the SIGNS
    lines:
      - text: Can't wake them up?
        mark:
          target: wake
        note: Pale or blue skin, slow breathing too.
      - text: Call an ambulance. Right now.
        mark:
          target: ambulance
        note: Most schools protect the caller. Look up yours.
      - text: Roll them on their side,
        mark:
          target: side
        note: So they can't choke if they throw up.
      - text: and stay with them.
        mark:
          target: stay
        note: '"Sleep it off" is how people die.'
      - text: Calling is never overreacting.
        mark:
        note:
    basis:
      - R-alcohol-drugs-002
    visibility: public
    approval:
      approved_hash: bc55afde7cf734db012cd1e75a954be4f52201b7c81a46444405a801303a85e3
      approved_by: round
      approved_round: 3
      linted_hash: bc55afde7cf734db012cd1e75a954be4f52201b7c81a46444405a801303a85e3
  - n: 50
    category: academics
    title: Finals GAME PLAN
    lines:
      - text: Map every final.
        mark:
          target: Map
        note: Date, time, room, what's covered.
      - text: Work backward from each one.
        mark:
          target: backward
        note: Hardest class gets the most hours.
      - text: Practice old exams.
        mark:
          target: Practice
        note: Timed. No notes. Like the real thing.
      - text: Sleep beats one more hour.
        mark:
          target: Sleep
        note: All-nighters cost you points.
      - text: Then walk in ready.
        mark:
        note:
    basis:
      - R-academics-001
      - R-college-008
    visibility: public
