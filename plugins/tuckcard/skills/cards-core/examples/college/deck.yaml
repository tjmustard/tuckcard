    category: direction
    title: Look How Far YOU'VE COME
    lines:
      - text: Look back a year.
        mark:
          target: year
        note: First week vs. now. Feel that?
      - text: You figured out a lot.
        mark:
          target: figured out
        note: Classes, people, laundry, yourself.
      - text: You survived the hard weeks.
        mark:
          target: survived
        note: Name the hardest one. You got through.
      - text: Write down three wins.
        mark:
          target: Write
        note: Read them next time it's rough.
      - text: We're proud of you. Keep going.
        mark:
        note:
