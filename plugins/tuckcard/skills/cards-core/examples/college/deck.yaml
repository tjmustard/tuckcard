    title: Never Drive BUZZED
    lines:
      - text: Buzzed is drunk.
        mark:
          target: Buzzed
        note: Feeling fine is the trap.
      - text: Weed counts too.
        mark:
          target: counts
        note: High drivers react slower. Same rule.
      - text: Planning to drink? Park it.
        mark:
          target: Park it
        note: Leave the truck. Get it tomorrow.
      - text: Never get in with a driver
        mark:
          target: driver
        note: Call a ride or call us. We'll pay.
