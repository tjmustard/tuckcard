        note: 'Ask the prof first: "Can I still pass?"'
      - text: Talk to your advisor
        mark:
          target: advisor
        note: They've seen this a thousand times.
      - text: before the deadline.
        mark:
          target: before
        note: After it, your options shrink fast.
      - text: A W beats a wrecked GPA.
        mark:
        note:
    basis:
      - R-college-003
      - R-core-006
    visibility: public
    approval:
