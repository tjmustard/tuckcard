    title: Consent Every TIME
    lines:
      - text: Ask. Every time.
        mark:
          target: Ask
        note: '"You good?" Simple. Not awkward.'
      - text: Only a clear yes is yes.
        mark:
          target: yes
        note: Silence, maybe, or "I guess" means stop.
      - text: Drunk can't consent.
        mark:
          target: Drunk
        note: If they're wasted, the answer is no.
      - text: Anyone can stop anytime.
        mark:
          target: stop
