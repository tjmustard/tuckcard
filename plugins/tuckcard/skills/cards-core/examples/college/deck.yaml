    title: Chase the DAYLIGHT
    lines:
      - text: Winter days get short.
        mark:
          target: short
        note: Dark at 4:30 drags anyone down.
      - text: Get outside before noon.
        mark:
          target: outside
        note: Walk to class the long way.
      - text: Move every day.
        mark:
          target: Move
        note: Gym, a run, a walk. Anything.
      - text: Feeling flat for weeks?
        mark:
          target: flat
        note: Winter slumps are real. Get checked.
      - text: Tell someone. Tell us.
        mark:
        note:
