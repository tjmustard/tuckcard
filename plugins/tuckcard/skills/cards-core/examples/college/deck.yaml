  - n: 52
    category: people
    title: Home Feels DIFFERENT
    lines:
      - text: Home might feel different.
        mark:
          target: different
        note: Your room, your town, even you.
      - text: You changed. Rules didn't.
        mark:
          target: changed
        note: Text if you'll be out late. Still.
      - text: Help around the house,
        mark:
          target: Help
        note: Dishes before anyone asks.
      - text: see your old friends,
        mark:
          target: see
        note: Some will feel the same. Some won't.
      - text: and rest up for next semester.
        mark:
        note:
    basis:
