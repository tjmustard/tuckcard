  - n: 51
    category: direction
    title: Remember Your WHY
    lines:
      - text: One semester down.
        mark:
          target: semester
        note: That's real. Take a second with it.
      - text: You picked this school
        mark:
          target: school
        note: Your first choice. Remember that?
      - text: and this major for a reason.
        mark:
          target: major
        note: Write the reason down. Keep it.
      - text: Hard weeks make it blurry.
        mark:
        note:
      - text: Hold on to your why.
        mark:
          target: why
        note: It's what gets you through week 8.
    basis:
      - R-core-005
      - R-personal-growth-002
