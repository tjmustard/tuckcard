    title: Get Good at AWKWARD
    lines:
      - text: Anything new feels awkward.
        mark:
          target: new
        note: New sport, new school, new people.
      - text: That's the price of growing.
        mark:
          target: price
        note: Nobody looks cool on day one.
      - text: The kids who get good
        mark:
          target: good
        note: Every senior was a clumsy freshman.
      - text: kept going when it felt weird.
        mark:
          target: weird
        note: Give it three weeks before you judge.
      - text: Be willing to look like a beginner.
