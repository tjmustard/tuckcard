    category: friends
    title: Be the UPSTANDER
    lines:
      - text: Someone's getting picked on?
        mark:
          target: picked on
        note: Hallway, locker room, online.
      - text: Don't just watch.
        mark:
          target: watch
        note: Laughing along counts as joining.
      - text: Step in, change the subject,
        mark:
          target: Step in
        note: "\"Bro, that's not funny.\""
      - text: or sit with them later.
        mark:
          target: sit with
        note: Checking on them matters most.
