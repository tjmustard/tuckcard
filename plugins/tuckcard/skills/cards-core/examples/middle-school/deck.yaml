        mark:
          target: everyone
        note: Tripped, blanked, bad haircut.
      - text: Most people missed it.
        mark:
          target: missed
        note: They're busy worrying about themselves.
      - text: The rest forgot by lunch.
        mark:
          target: forgot
        note: Can you remember their worst moment?
      - text: Your brain shines a spotlight
