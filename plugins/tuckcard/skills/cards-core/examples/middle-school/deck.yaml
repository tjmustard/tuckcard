  - n: 51
    category: feelings
    title: Anger Is a SIGNAL
    lines:
      - text: Anger is a signal.
        mark:
          target: Anger
        note: Useful info, loud delivery.
      - text: "Ask what's under it:"
        mark:
          target: under
        note: Hurt? Embarrassed? Scared? Disrespected?
      - text: Hit the pause first.
        mark:
          target: pause
        note: Walk, breathe, shoot around. Then talk.
      - text: Then say the real thing.
        mark:
          target: real thing
        note: '"I felt disrespected when..."'
      - text: Strength is staying in control.
        mark:
        note:
