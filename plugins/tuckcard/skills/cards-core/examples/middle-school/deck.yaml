    title: Crush CODE
    lines:
      - text: Got a crush? Normal.
        mark:
          target: crush
        note: Everyone gets them. Even us, once.
      - text: Be honest and kind.
        mark:
          target: honest
        note: Say it yourself. No messengers.
      - text: If it's a no, take it well.
        mark:
          target: no
        note: '"Cool, no worries." Then let it go.'
      - text: Keep their business private.
        mark:
          target: business
        note: No screenshots. No group-chat reports.
      - text: How you treat people says who you are.
        mark:
