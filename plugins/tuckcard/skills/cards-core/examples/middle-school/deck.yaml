        note: Real friends push you up, not down.
      - text: be that friend back,
        mark:
          target: be that friend
        note: Text first. Have their back.
      - text: and when the drama starts,
        mark:
        note:
      - text: you're allowed to walk away.
        mark:
          target: walk away.
        note: Leaving the group chat counts.
