    category: feelings
    title: Stress Can Be FUEL
    lines:
      - text: A little stress helps.
        mark:
          target: stress
        note: Fast heart means fuel is on the way.
      - text: It sharpens you up.
        mark:
          target: sharpens
        note: Treat it like pregame nerves.
      - text: Too much? Shrink the list.
        mark:
          target: Too much
        note: Write every task down. Pick one.
      - text: Move, sleep, and talk it out.
        mark:
          target: Move
        note: Run around for ten minutes.
      - text: Stress is fuel when you steer it.
        mark:
        note:
