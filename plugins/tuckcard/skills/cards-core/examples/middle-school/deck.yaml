    title: Sisters FOREVER
    lines:
      - text: Your sister is watching you.
        mark:
          target: sister
        note: She copies how you talk and act.
      - text: Be the big sister you'd want.
        mark:
          target: want
        note: Who did you look up to at her age?
      - text: Include her sometimes,
        mark:
          target: Include
        note: One round of cards counts.
      - text: stick up for her always.
        mark:
          target: stick up
        note: Tease at home, defend everywhere else.
      - text: Teammates come and go. Sisters stay.
