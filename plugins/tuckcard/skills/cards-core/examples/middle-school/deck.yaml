    title: Listen to UNDERSTAND
    lines:
      - text: Most people listen
        mark:
          target: listen
        note: Phone down. Eyes up.
      - text: just to reply.
        mark:
          target: reply
        note: Planning a comeback? You missed it.
      - text: Try listening to understand.
        mark:
          target: understand
        note: 'Say it back: "So you mean..."'
      - text: Ask one more question.
        mark:
          target: question
        note: '"What do you mean by that?"'
      - text: People open up to good listeners.
        mark:
