  - n: 16
    category: growth
    title: Own IT
    lines:
      - text: When you mess up,
        mark:
          target: mess up
        note: Everyone does. Adults too.
      - text: skip the excuses.
        mark:
          target: excuses
        note: '"But" cancels everything before it.'
      - text: Say what happened,
        mark:
        note:
      - text: fix what you can,
        mark:
          target: fix
        note: Make it right before anyone asks.
      - text: and own the rest.
        mark:
          target: own
