  - n: 49
    category: school
    title: The Tough TEACHER
    lines:
      - text: You won't click with everyone.
        mark:
          target: click
        note: Future bosses will be like this too.
      - text: You can still learn from them.
        mark:
          target: learn
        note: Learn what they want. Deliver it.
      - text: Stay respectful, do the work.
        mark:
          target: work
        note: Make your work impossible to criticize.
      - text: Still unclear? Ask them.
        mark:
          target: unclear
        note: Ask, "What would an A look like?"
      - text: Then bring us in if it's really unfair.
        mark:
        note:
    basis:
