    category: speak-up
    title: Say Thanks OUT LOUD
    lines:
      - text: Gratitude you don't say
        mark:
          target: Gratitude
        note: Name one thing at dinner tonight.
      - text: doesn't count for much.
        mark:
        note:
      - text: Thank coaches, teachers, us.
        mark:
          target: coaches
        note: Handshake after the season. Every one.
      - text: Text the friend who showed up.
        mark:
          target: Text
        note: '"Thanks for having my back today."'
      - text: Be specific. It hits harder.
        mark:
          target: specific
        note: '"Thanks for the ride at 6 a.m."'
