    category: school
    title: Focus MODE
    lines:
      - text: Your brain can't multitask.
        mark:
          target: multitask
        note: It switches. Every switch costs you.
      - text: Every ping pulls you out.
        mark:
          target: ping
        note: Getting back in takes way longer.
      - text: Phone in another room,
        mark:
          target: room
        note: Out of sight, out of mind. Literally.
      - text: one task at a time,
        mark:
          target: task
        note: One thing, 25-minute timer.
      - text: and the work goes way faster.
        mark:
        note:
