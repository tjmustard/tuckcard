  - n: 15
    category: feelings
    title: Ride the WAVE
    lines:
      - text: Every feeling is a wave.
        mark:
          target: wave
        note: Anger, panic, cringe. All waves.
      - text: It builds, it peaks,
        mark:
          target: builds
        note: 'Notice it early: jaw, chest, fists.'
      - text: and then it passes.
        mark:
          target: passes
        note: Usually faster than you'd guess.
      - text: Don't act at the top.
        mark:
          target: top
        note: No texts, no comebacks, no decisions.
      - text: Breathe, wait, then decide.
        mark:
        note:
