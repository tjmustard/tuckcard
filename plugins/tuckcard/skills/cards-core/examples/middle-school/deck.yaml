    category: friends
    title: Ask FIRST
    lines:
      - text: Ask before you touch,
        mark:
          target: Ask
        note: Hugs, hands, anything. Just ask.
      - text: post, or share their photo.
        mark:
          target: share
        note: Their picture, their call.
      - text: Only yes means yes.
        mark:
          target: yes
        note: Silence or "I guess" isn't yes.
      - text: A no is final.
        mark:
          target: no
        note: Don't ask twice. Don't sulk.
      - text: Respect makes you someone people trust.
