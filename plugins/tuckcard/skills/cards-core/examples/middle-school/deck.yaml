    title: Advocate for YOURSELF
    lines:
      - text: Nobody knows you're lost
        mark:
          target: lost
        note: Teachers can't read minds.
      - text: until you say something.
        mark:
          target: say
        note: '"Can I come in at lunch for help?"'
      - text: Send the email.
        mark:
          target: email
        note: Polite. Specific. One question.
      - text: Ask about the grade.
        mark:
          target: grade
        note: '"What can I do to bring this up?"'
