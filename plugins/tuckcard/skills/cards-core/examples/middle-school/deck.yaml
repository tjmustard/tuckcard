    category: school
    title: Grades Are DATA
    lines:
      - text: A grade is data.
        mark:
          target: data
        note: Which topics cost you points?
      - text: It shows what you know
        mark:
          target: know
        note: Circle what you got right too.
      - text: and what to work on next.
        mark:
          target: work on
        note: Pick one topic. Fix it this week.
      - text: Bad grade? Ask why.
        mark:
          target: Bad grade
        note: Tell us before we see it online.
      - text: You are more than a number.
        mark:
