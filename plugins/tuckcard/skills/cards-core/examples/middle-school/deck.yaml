    category: game-day
    title: Sleep Is TRAINING
    lines:
      - text: Recovery happens in bed.
        mark:
          target: Recovery
        note: Meet tomorrow? Bed by ten.
      - text: Short sleep makes you slower,
        mark:
          target: slower
        note: Slower reactions, more injuries.
      - text: weaker, and moody.
        mark:
          target: moody
        note: Tired feels a lot like angry.
      - text: Phone out an hour before bed.
        mark:
          target: out
        note: Charge it in the kitchen.
      - text: Sleep is part of the work.
        mark:
        note:
