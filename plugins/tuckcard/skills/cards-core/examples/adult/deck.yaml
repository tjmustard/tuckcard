- n: 5
  category: choices
  title: Don't Sign ANGRY
  lines:
  - text: Nothing about money is urgent
    mark:
      target: money
    note: not a contract, not a cancellation, not a transfer.
  - text: at 10pm on a bad day.
    mark:
      target: 10pm
    note: Late and angry is how bad deals get signed.
  - text: Close the page.
    mark:
      target: Close
    note: Set a reminder for the morning.
  - text: The document keeps.
    mark:
      target: keeps
    note: It waited a month. It can wait a night.
