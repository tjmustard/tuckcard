  category: choices
  title: 'Money: ONE NUMBER'
  lines:
  - text: Rent, food, the train, the bills.
    mark:
      target: Rent
    note: Add the boring ones too. Boring is the point.
  - text: That total is one number.
    mark:
      target: one number
    note: Write it on the fridge. It is not a verdict.
  - text: It's the floor under every choice,
    mark:
      target: floor
    note: You decide from it, not about it.
  - text: not a score about you.
