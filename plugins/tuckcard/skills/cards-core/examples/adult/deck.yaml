  category: work
  title: Say the ASK Plainly
  lines:
  - text: Say what you need in one line.
    mark:
      target: one line
    note: I need two more days on the report.
  - text: Then say why, in one more.
    mark:
      target: why
    note: The data came late and I don't want to guess.
  - text: No apology paragraph.
    mark:
      target: apology
    note: Sorry is fine once. Not five times.
  - text: People can answer a clear ask.
    mark:
      target: answer
    note: Vague asks get vague silence.
