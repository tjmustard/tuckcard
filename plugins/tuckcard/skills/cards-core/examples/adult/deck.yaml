  category: choices
  title: Two DRINKS Is a Plan
  lines:
  - text: Decide the number before you go.
    mark:
      target: before
    note: Two drinks, then water. Say it in the taxi.
  - text: Buzzed is still over the line,
    mark:
      target: Buzzed
    note: feeling fine is not the same as being fine.
  - text: so the car stays home.
    mark:
      target: car stays home
    note: Leave it. Collect it tomorrow.
  - text: If the night gets heavy,
    mark:
      target: heavy
    note: name it to the person you came with. Out loud.
  - text: say it out loud and go.
    mark:
