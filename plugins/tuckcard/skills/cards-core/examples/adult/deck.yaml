- n: 3
  category: choices
  title: Say NO Before YES
  lines:
  - text: Every yes spends a Tuesday.
    mark:
      target: spends
    note: Open the calendar first, then answer.
  - text: Look at the week first.
    mark:
      target: week
    note: If the week is full, the answer is already no.
  - text: I'll check and come back is an answer.
    mark:
      target: come back
    note: It buys you the hour you need.
  - text: A no now costs less than a yes
    mark:
      target: no now
    note: the yes you break later costs more.
  - text: you break later.
    mark:
    note:
