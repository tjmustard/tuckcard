  title: Sleep on the BIG ONE
  lines:
  - text: An offer that dies overnight
    mark:
      target: dies overnight
    note: was a push, not an offer.
  - text: Decide in the morning,
    mark:
      target: morning
    note: not at 11pm with your phone in your hand.
  - text: both paths on one page.
    mark:
      target: both paths
    note: Two lines each. If you can't, it isn't ready.
  - text: Then take the one you'd explain
    mark:
      target: explain
    note: to your kid, or to the friend who saw you last year.
  - text: at breakfast, not at dinner.
    mark:
    note:
