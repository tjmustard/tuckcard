      linted_hash: bdb47a5125349558d2d2902fcefbe7c32e532c6d4c75f9b98c911f9fb63e3d44
  - n: 7
    category: school
    title: Not Fixed
    lines:
      - text: Being bad at something says where you are, not where you stop.
        mark:
          target: where you are
        note: a starting point can move
      - text: The people around you shape what feels possible. Find one who talks about getting better.
        mark:
        note:
      - text: Thinking differently is not a grade promise. It changes what you are willing to try.
        mark:
        note:
    basis:
      - R-high-school-002
      - R-high-school-003
    visibility: public
    approval:
