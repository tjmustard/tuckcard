  - n: 22
    category: feelings
    title: Feelings Are a Skill
    lines:
      - text: Handling a feeling is taught, like a subject.
        mark:
          target: taught, like a subject
        note: nobody is born knowing it
      - text: Watch one person you trust do it. Ask them what they do.
        mark:
        note:
      - text: Then try one small version yourself this week.
        mark:
        note:
    basis:
      - R-emotional-intelligence-003
    visibility: public
    approval:
