  - n: 11
    category: team
    title: Three Breaths
    lines:
      - text: Before training, take three slow breaths.
        mark:
        note:
      - text: Count them. That is the whole practice.
        mark:
          target: the whole practice
        note: attention is a skill you train
      - text: Do it again next session. Short and repeatable beats long and rare.
        mark:
        note:
    basis:
      - R-athletics-003
    visibility: public
    approval:
