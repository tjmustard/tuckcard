  - n: 17
    category: team
    title: One Play
    lines:
      - text: After a mistake, name the next play.
        mark:
          target: the next play
        note: one action, now
      - text: Not the last one. Not the whole game.
        mark:
        note:
      - text: Then say it out loud so your body hears it.
        mark:
        note:
