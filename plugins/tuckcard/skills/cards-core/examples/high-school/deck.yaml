  - n: 12
    category: team
    title: Sleep Is Part of It
    lines:
      - text: A bedtime is part of training.
        mark:
          target: part of training
        note: rest is not the opposite of work
      - text: Leave the phone outside the bed so the hour is yours.
        mark:
          target: outside the bed
        note: one small move
      - text: Sleep is not proof you care. It is what lets the body do the work.
        mark:
        note:
    basis:
      - R-high-school-004
      - R-athletics-004
    visibility: public
