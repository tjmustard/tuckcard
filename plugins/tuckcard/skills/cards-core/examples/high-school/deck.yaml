  - n: 28
    category: friends
    title: Save the Messages
    lines:
      - text: If messages turn cruel, do not delete them.
        mark:
          target: do not delete them
        note: keep the evidence
      - text: Screenshot the thread and the account name.
        mark:
        note:
      - text: 'Tell a trusted adult: a parent, a coach or a school counsellor.'
        mark:
