  - n: 19
    category: feelings
    title: Name It Plain
    lines:
      - text: When a feeling is loud, give it a plain word.
        mark:
          target: a plain word
        note: mad, sad, scared, embarrassed
      - text: Write it in one line, not a story.
        mark:
        note:
      - text: Naming it does not fix it. It gives you somewhere to stand.
        mark:
        note:
    basis:
