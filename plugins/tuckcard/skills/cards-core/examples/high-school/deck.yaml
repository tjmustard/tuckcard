      approved_round: 1
      linted_hash: 89994bf4b5bec1e42c1bc1ac17a101544f5915a4363faa699cc80aa6dbf754c7
  - n: 5
    category: school
    title: Five Minutes
    lines:
      - text: 'The work you avoid: give it five minutes.'
        mark:
          target: five minutes
        note: a first step, not the whole task
      - text: Open the file, read the task, write one messy sentence.
        mark:
        note:
      - text: You can stop at five. Starting is the part you are practising.
        mark:
        note:
    basis:
      - R-academics-007
      - R-core-006
    visibility: public
