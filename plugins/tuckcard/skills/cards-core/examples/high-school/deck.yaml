  - n: 10
    category: team
    title: One Cue
    lines:
      - text: Pick three words to say before a skill.
        mark:
          target: three words
        note: short enough to survive the whistle
      - text: 'Pass: hands first. Shot: elbow, follow.'
        mark:
          target: elbow, follow
        note: your words will be better
      - text: Say it once, then play. A cue is a habit, not a spell.
        mark:
        note:
    basis:
      - R-athletics-002
      - R-core-006
    visibility: public
    approval:
