  - n: 14
    category: team
    title: Ask the Coach
    lines:
      - text: If a soreness or a slump lasts more than a week, tell your coach.
        mark:
          target: more than a week
        note: a rough number, not a rule
      - text: For pain that worries you, ask a doctor or a counsellor, not a teammate.
        mark:
        note:
      - text: Pushing through is not a personality. It is a decision you can change.
        mark:
        note:
    basis:
      - R-athletics-007
    visibility: public
    approval:
      approved_hash: 17da26e43e31c021bc3a2a00a4f4c49f34e2389a872f1816c89059c5b48a7a81
