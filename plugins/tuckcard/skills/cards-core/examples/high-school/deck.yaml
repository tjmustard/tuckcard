  - n: 8
    category: school
    title: Phone at the Door
    lines:
      - text: At study time, phone in another room.
        mark:
          target: another room
        note: out of reach beats face down
      - text: Not because the phone is evil. Because every buzz makes you decide again.
        mark:
        note:
      - text: Decide once at the start instead of thirty times.
        mark:
        note:
    basis:
      - R-core-006
      - R-core-008
    visibility: public
    approval:
