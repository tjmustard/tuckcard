  - n: 21
    category: feelings
    title: Tell One Person
    lines:
      - text: Do not carry a hard week alone.
        mark:
          target: alone
        note: one person is enough to start
      - text: Pick the person you would text at 9pm. Tell them one true sentence.
        mark:
        note:
      - text: You do not need the whole story ready before you speak.
        mark:
        note:
    basis:
      - R-high-school-007
      - R-emotional-intelligence-006
    visibility: public
