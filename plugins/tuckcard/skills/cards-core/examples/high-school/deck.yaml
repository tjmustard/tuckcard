  - n: 16
    category: team
    title: Enjoy the Drill
    lines:
      - text: Pick the drill you like least and find one thing to get better at in it.
        mark:
          target: one thing
        note: small enough to feel this week
      - text: Not the score. The touch, the timing, the footwork.
        mark:
          target: The touch, the timing
        note: small things you can feel
      - text: Getting better is the point you can keep.
        mark:
        note:
    basis:
      - R-athletics-001
    visibility: public
    approval:
