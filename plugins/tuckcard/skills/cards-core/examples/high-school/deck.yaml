  - n: 9
    category: school
    title: One Box
    lines:
      - text: Write tomorrow's school list as one sentence.
        mark:
        note:
      - text: Not the week. The first thing after breakfast.
        mark:
          target: after breakfast
        note: a time and a place
      - text: Cross it off when it is done, then stop looking at the list.
        mark:
        note:
    basis:
      - R-academics-009
      - R-core-006
    visibility: public
    approval:
