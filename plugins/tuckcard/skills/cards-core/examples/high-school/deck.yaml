  - n: 6
    category: school
    title: Where It Shows Up
    lines:
      - text: Pick one idea from science class and find it in your week.
        mark:
        note:
      - text: Bread rising. The push when you brake. Both are science.
        mark:
          target: The push when you brake
        note: your example will beat ours
      - text: A subject is easier to hold when it touches something you already know.
        mark:
        note:
    basis:
      - R-high-school-001
      - R-core-005
    visibility: public
    approval:
