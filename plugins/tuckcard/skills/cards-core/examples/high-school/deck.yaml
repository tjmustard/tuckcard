  - n: 27
    category: feelings
    title: A Hard Week Is Not You
    lines:
      - text: A hard week is something that happened. It is not who you are.
        mark:
          target: something that happened
        note: a week, not a verdict
      - text: Write one thing you got through, even badly.
        mark:
        note:
      - text: Keep the list where you can see it on the next hard day.
        mark:
        note:
