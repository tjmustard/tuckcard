  - n: 18
    category: team
    title: Practice the Reset
    lines:
      - text: After a mistake, talk to yourself like a teammate.
        mark:
          target: teammate
        note: would you say it out loud to them?
      - text: 'Try: next ball.'
        mark:
        note:
      - text: That is a skill you can practise, not a mood you have to wait for.
        mark:
        note:
