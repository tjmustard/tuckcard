cards:
  - n: 1
    category: school
    title: Close the Book
    lines:
      - text: Read your notes once, then close the book.
        mark:
          target: close the book
        note: the page is a prop, not a crutch
      - text: Write down everything you remember on a blank page.
        mark:
        note:
      - text: Then open the notes and fill the gaps in another colour.
        mark:
        note:
    basis:
      - R-academics-001
      - R-core-006
    visibility: public
    approval:
      approved_hash: e860549f0148bc7a0535bdc2f238995f446c91b648765ea121fbfa9108e35947
