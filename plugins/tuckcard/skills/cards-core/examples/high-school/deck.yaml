      approved_round: 2
      linted_hash: 17da26e43e31c021bc3a2a00a4f4c49f34e2389a872f1816c89059c5b48a7a81
  - n: 15
    category: team
    title: The Season Is One Part
    lines:
      - text: The season sits inside your life, not against it.
        mark:
          target: inside your life
        note: school and rest are not the enemy
      - text: One night a week, do something that is not practice.
        mark:
          target: One night a week
        note: choose it before the week fills up
      - text: A team that needs you to drop everything is worth asking about.
        mark:
        note:
    basis:
      - R-athletics-008
      - R-core-008
    visibility: public
    approval:
