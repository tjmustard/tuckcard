  - n: 23
    category: feelings
    title: Tired Is a Feeling Too
    lines:
      - text: Some heavy days are a sleep problem wearing a feeling's coat.
        mark:
          target: a sleep problem
        note: check the simple thing first
      - text: Try one earlier night and see what the next day is like.
        mark:
        note:
      - text: If the weight stays for weeks, tell a doctor, a counsellor or a trusted adult.
        mark:
        note:
