  - n: 25
    category: feelings
    title: Say It Out Loud
    lines:
      - text: Keeping a hard feeling from the people close to you is not strength.
        mark:
          target: not strength
        note: hiding costs more than it saves
      - text: Tell one of them what is actually going on.
        mark:
        note:
      - text: You can ask for company without asking them to fix it.
        mark:
        note:
