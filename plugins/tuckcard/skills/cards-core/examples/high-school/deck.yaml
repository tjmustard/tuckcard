  - n: 24
    category: feelings
    title: Put the Replay Down
    lines:
      - text: Replaying the same scene feels like work. It usually is not.
        mark:
          target: feels like work
        note: the loop keeps the sting fresh
      - text: When you catch the replay, name what you would do differently next time.
        mark:
        note:
      - text: Then put it down until tomorrow.
        mark:
        note:
    basis:
      - R-emotional-intelligence-005
      - R-core-006
    visibility: public
    approval:
