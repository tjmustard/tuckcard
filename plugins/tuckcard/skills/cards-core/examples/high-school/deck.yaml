      linted_hash: e860549f0148bc7a0535bdc2f238995f446c91b648765ea121fbfa9108e35947
  - n: 2
    category: school
    title: Mixed Set
    lines:
      - text: Do one from each section, not ten from one.
        mark:
          target: one from each section
        note: mixing the kinds is the practice
      - text: Switching feels harder because you have to choose what comes next.
        mark:
        note:
      - text: Ten in a row feels smooth because the choosing is already done for you.
        mark:
        note:
    basis:
      - R-academics-002
    visibility: public
    approval:
      approved_hash: 84a86ffd8c42ae08090302e86fb39a1524f2c6ad3ec69c2f60f1b17b456cd7fe
      approved_by: round
      approved_round: 1
      linted_hash: 84a86ffd8c42ae08090302e86fb39a1524f2c6ad3ec69c2f60f1b17b456cd7fe
  - n: 3
    category: school
    title: First Question
    lines:
      - text: When the paper lands, read the first question twice.
        mark:
          target: read the first question
        note: once for the words, once for the ask
      - text: Then write the next thing you can do, not the grade you need.
        mark:
          target: next thing you can do
        note: one action you control
      - text: The mark is one number. It is not the whole subject.
        mark:
        note:
    basis:
      - R-high-school-008
      - R-academics-005
    visibility: public
    approval:
      approved_hash: e73ad439d8a3938cd62122517f106e175ee0c4a7f2b54343de059d114fddde8f
      approved_by: round
      approved_round: 8
      linted_hash: e73ad439d8a3938cd62122517f106e175ee0c4a7f2b54343de059d114fddde8f
  - n: 4
    category: school
    title: Ask What Next
    lines:
      - text: Take the marked work to your teacher and ask one question.
        mark:
        note:
      - text: 'Try: what should I do differently on the next piece?'
        mark:
          target: what should I do differently
        note: about the work, not about you
      - text: Then use one thing from the answer, not all of it at once.
        mark:
        note:
    basis:
      - R-academics-004
    visibility: public
    approval:
      approved_hash: 89994bf4b5bec1e42c1bc1ac17a101544f5915a4363faa699cc80aa6dbf754c7
