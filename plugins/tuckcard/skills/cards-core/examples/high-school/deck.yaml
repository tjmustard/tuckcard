    category: feelings
    title: Ask What They Felt
    lines:
      - text: Guessing what someone felt is a skill you can practise.
        mark:
          target: a skill
        note: not a talent some people have
      - text: 'After a fight, ask: what was that like for you?'
        mark:
        note:
      - text: Listen to the answer without planning your defence.
        mark:
        note:
