  - n: 20
    category: feelings
    title: What Would a Friend Say?
    lines:
      - text: Think of what you would say to a friend in this exact spot.
        mark:
          target: a friend
        note: same words, same voice
      - text: Then say it to yourself, out loud if you can.
        mark:
        note:
      - text: You are allowed the kindness you hand out so easily.
        mark:
        note:
