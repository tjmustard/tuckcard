  - n: 13
    category: team
    title: Same Team
    lines:
      - text: A bad game does not change what you are worth to this team.
        mark:
          target: does not change
        note: the scoreboard is not a verdict on you
      - text: It changes what you practise next.
        mark:
        note:
      - text: Ask what the game showed you, not what it said about you.
        mark:
        note:
    basis:
      - R-athletics-006
      - R-athletics-005
    visibility: public
    approval:
