name: ci

on:
  push:
  pull_request:

jobs:
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          for path in (
              ".claude-plugin/marketplace.json",
              "plugins/tuckcard/.claude-plugin/plugin.json",
          ):
              data = json.loads(pathlib.Path(path).read_text())
              print(f"{path}: ok (name={data['name']})")
          PY

      - name: Every font family ships a font file and its OFL license
        run: |
          set -euo pipefail
          fonts=plugins/tuckcard/skills/cards-core/fonts
          families=$(find "$fonts" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          for dir in "$fonts"/*/; do
            family=$(basename "$dir")
            test -f "$dir/OFL.txt" || { echo "missing OFL.txt in $family"; exit 1; }
            test -n "$(find "$dir" -maxdepth 1 -name '*.ttf' -print -quit)" \
              || { echo "missing font file in $family"; exit 1; }
            echo "$family: ok"
          done
          test "$families" -eq 9 || { echo "expected 9 font families, found $families"; exit 1; }

      - name: No personal decks, bundles or renders are committed
        run: |
          set -euo pipefail
          decks=$(git ls-files | grep -E '(^|/)deck\.yaml$' | grep -v '^plugins/tuckcard/skills/cards-core/examples/' || true)
          bundles=$(git ls-files '*.tuckcard.zip' || true)
          renders=$(git ls-files | grep -E '(^|/)(renders|out)/' || true)
          for hit in $decks $bundles $renders; do
            echo "committed private output: $hit"
          done
          test -z "$decks$bundles$renders"

  validation:
    # Pinned, not ubuntu-latest: the label moved to Ubuntu 26.04, whose
    # actions/python-versions manifest carries no Python 3.9 build, so the 3.9
    # leg failed at setup-python before running a single project step.
    # ubuntu-24.04 still has 3.9, which keeps the SPEC floor exercised.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate knowledge rules
        run: python plugins/tuckcard/skills/cards-core/scripts/validate_rules.py

      - name: Run the schema and validation tests
        run: python -m pytest -q

      # The license check reads installed metadata, and Python 3.9 resolves a
      # dotted pin name less forgivingly than 3.12 does. Run the real lookup
      # on the floor, after the lean tests so that run stays lean.
      - name: Install the renderer development tools for the license check
        if: matrix.python-version == '3.9'
        run: python -m pip install --requirement requirements-dev.txt

      - name: Every license is permissive and THIRD_PARTY.md is current
        if: matrix.python-version == '3.9'
        run: python tools/third_party.py --check

  # The renderer without a browser: assets, the shared plan and the Pillow
  # path. Chromium is never downloaded here; the parity run that needs it is a
  # developer command (tools/parity/run.py).
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the validation and renderer development tools
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Every license is permissive and THIRD_PARTY.md is current
        run: python tools/third_party.py --check

      - name: Draw every card with Pillow, and run lint, bundle and env probe
        run: >-
          python -m pytest -q
          tests/test_render_assets.py
          tests/test_render_plan.py
          tests/test_render_hand_edits.py
          tests/test_render_pillow.py
          tests/test_lint.py
          tests/test_bundle.py
          tests/test_env_probe.py
          tests/test_third_party.py
