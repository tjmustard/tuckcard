name: weekly-recheck

# The weekly existence and retraction check for shipped findings
# (SPEC.md section 3, invariant 1). It runs verify_citations.py with live
# network access. Until milestone M5 ships findings there is nothing to
# re-check, and the run says so instead of claiming a pass.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Re-check every shipped finding
        run: |
          set -euo pipefail
          findings=plugins/tuckcard/skills/cards-core/knowledge/findings
          count=$(find "$findings" -maxdepth 1 -name 'F-*.md' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "Nothing to re-check yet: no shipped findings exist (milestone M5)."
            echo "No check ran in this run, so this is not a pass."
            exit 0
          fi
          echo "Re-checking $count shipped findings against Crossref and PubMed."
          python plugins/tuckcard/skills/cards-core/scripts/verify_citations.py
