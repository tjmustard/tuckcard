scope: core
status: active
description: Applies to every deck.
rules:
  - id: R-core-001
    type: do
    strength: must
    applies_to: [title, lines]
    when: null
    overrides: []
    text: Keep each line to one idea.
    why: A second idea makes the card harder to remember.
    check: judge
    lint: null
    examples:
      bad: "Rest, study and call your friend."
      good: "Rest first."
